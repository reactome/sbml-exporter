# The CI tools under ci/ (comparison, validation, fixture extraction), checked and
# formatted in CI by the pinned Ruff in .github/workflows/ci.yml.
line-length = 100
target-version = "py310"

[lint]
# Ruff's defaults (pyflakes and the pycodestyle errors) and bugbear's likely bugs.
select = ["E4", "E7", "E9", "F", "B"]
